name: Reproducibility Check

on:
  push:
    branches: [ repro-check ]
  pull_request:
    branches: [ repro-check ]
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import sys,platform; print('Python', sys.version); print('Platform', platform.platform())"
          python -c "import pandas, polars, numpy, pyarrow, statsmodels, spacy; print('pandas', pandas.__version__); print('polars', polars.__version__); print('numpy', numpy.__version__); print('pyarrow', pyarrow.__version__); print('statsmodels', statsmodels.__version__); print('spacy', spacy.__version__)"

      - name: Execute StudyPipeline (execute+export HTML)
        run: |
          set -e
          # Execute and export StudyPipeline; execution will also write data-clean/processed/* and outputs/*
          jupyter nbconvert --to html --execute StudyPipeline.ipynb --output outputs/StudyPipeline.html --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.timeout=3600

      - name: Optionally execute Desktop report if present
        run: |
          set -e
          if [ -f "MertYesilyurt_Report.ipynb" ]; then
            jupyter nbconvert --to html --execute MertYesilyurt_Report.ipynb --output outputs/MertYesilyurt_Report.html --ExecutePreprocessor.kernel_name=python3 --ExecutePreprocessor.timeout=3600 || true
          else
            echo "Desktop report notebook not present in repo; skipping."
          fi

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/data-clean/processed artifacts/outputs/figures
          # Copy processed tables and figures
          if [ -d data-clean/processed ]; then
            cp -R data-clean/processed/. artifacts/data-clean/processed/ || true
          fi
          # Copy HTML reports
          if [ -f outputs/StudyPipeline.html ]; then
            mkdir -p artifacts/outputs
            cp outputs/StudyPipeline.html artifacts/outputs/StudyPipeline.html
          fi

      - name: Compare outputs against baseline
        run: |
          python scripts/compare_outputs.py --baseline data-clean/processed --candidate artifacts/data-clean/processed --html-baseline outputs/StudyPipeline.html --html-candidate artifacts/outputs/StudyPipeline.html --report compare_report.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notebook-artifacts
          path: |
            artifacts
            compare_report.json